name: Kimi Code Sync

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Parse Kimi command
        id: parse
        run: |
          TITLE='${{ github.event.issue.title }}'
          
          # Extract filename from [KIMI] path/to/file.ext
          if [[ "$TITLE" =~ \[KIMI\][[:space:]]*(.+)$ ]]; then
            FILENAME="${BASH_REMATCH[1]}"
            echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            echo "trigger=true" >> $GITHUB_OUTPUT
          else
            echo "trigger=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create file from issue body
        if: steps.parse.outputs.trigger == 'true'
        run: |
          FILENAME="${{ steps.parse.outputs.filename }}"
          mkdir -p "$(dirname "$FILENAME")"
          
          # Write issue body to file
          cat << 'BODY_EOF' > "$FILENAME"
          ${{ github.event.issue.body }}
          BODY_EOF
      
      - name: Commit and push
        if: steps.parse.outputs.trigger == 'true'
        run: |
          git config user.name "Kimi Bot"
          git config user.email "kimi@noxtyr.game"
          git add .
          git commit -m "🤖 Auto-sync: ${{ steps.parse.outputs.filename }} from Kimi issue #${{ github.event.issue.number }}"
          git push
      
      - name: Close issue with comment
        if: steps.parse.outputs.trigger == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Файл `' + '${{ steps.parse.outputs.filename }}' + '` успішно створено!'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['auto-synced']
            });
